name: Build executables

on:
  push:
  workflow_dispatch:

jobs:
  build:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact: meowducer-windows-x64
          - os: ubuntu-latest
            artifact: meowducer-linux-x64

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python on Windows
        if: runner.os == 'Windows'
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Linux Tkinter build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-tk python3-venv

      - name: Build Windows executable
        if: runner.os == 'Windows'
        run: |
          python -m pip install --upgrade pyinstaller
          python -m PyInstaller --noconfirm --clean --onefile --windowed --name meowducer meowducer.py

      - name: Build Linux executable
        if: runner.os == 'Linux'
        run: |
          python3 -m venv .venv
          .venv/bin/python -m pip install --upgrade pip pyinstaller
          .venv/bin/python -m PyInstaller --noconfirm --clean --onefile --windowed --name meowducer meowducer.py

      - name: Upload Windows executable
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: dist/meowducer.exe

      - name: Upload Linux executable
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: dist/meowducer